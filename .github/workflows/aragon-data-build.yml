name: Importar autonómicas de Aragón
on:
  push:
    branches: [feature/autonomicas-aragon-historico-2026]
    paths: [scripts/build_aragon.py, .github/workflows/aragon-data-build.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Descargar resultados definitivos del Gobierno de Aragón
        run: |
          python3 -u scripts/build_aragon.py
          python3 scripts/validate_atlas.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commitear resultados contrastados por el validador
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: incorporar autonómicas Aragón 2003–2026 oficiales'
            git push origin HEAD:feature/autonomicas-aragon-historico-2026
          fi
