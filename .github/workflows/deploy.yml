name: Deploy My Places to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static JavaScript and electoral data
        run: |
          node --input-type=module --check < site/app.js
          node --input-type=module --check < site/atlas.js
          node --input-type=module --check < site/trends.js
          python3 scripts/validate_atlas.py
      - name: Construir paquete público solo de marcadores
        run: |
          python3 scripts/build_public_site.py --output _public
          test ! -e _public/atlas.js
          test ! -e _public/trends.js
          test ! -e _public/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_public
      - id: deployment
        uses: actions/deploy-pages@v4
